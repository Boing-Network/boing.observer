# Boing Observer — Cloudflare Worker (OpenNext). https://developers.cloudflare.com/workers/wrangler/configuration/
name = "boing-observer"
main = ".open-next/worker.js"
compatibility_date = "2025-02-01"
compatibility_flags = [ "nodejs_compat", "global_fetch_strictly_public" ]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "boing-observer"

# --- DEX discovery (ops) ---
# Plain environment variable (not a Workers "secret"). Read by API routes at runtime on Cloudflare.
# Set to "1" here to enable the diagnostics checkbox + boing_listDexPools / boing_listDexTokens includeDiagnostics.
# You can instead override in the dashboard: Worker → Settings → Variables and secrets → Add variable
# (use type "plain text", not "secret") — same name: BOING_OBSERVER_ALLOW_DEX_DIAGNOSTICS = 1
#
# Optional factory hints (plain text, same dashboard path) only after the hosted chain publishes a factory.
# Do not set historical tunnel-ledger hexes. Live source of truth: boing_getNetworkInfo.end_user.canonical_native_dex_factory.
#   BOING_NATIVE_VM_DEX_FACTORY or BOING_DEX_FACTORY_HEX = 0x + 64 hex (see boing-sdk mergeNativeDexIntegrationDefaults).
# --- Shared rate limiting (src/lib/rate-limit.ts; src/middleware.ts applies it to /api/*) ---
# Workers Rate Limiting bindings, checked IN ADDITION to the per-isolate in-memory limiter (which stays as the
# fallback when a binding is missing, e.g. local dev). Each binding has one fixed limit per client IP:
#   API_RATE_LIMITER        240/min  rpc, default api and csp-report buckets (also the fallback for the others)
#   API_RATE_LIMITER_HEAVY   60/min  fan-out routes (account history/nfts, asset/*, dex/*, blob/*, ...)
#   API_RATE_LIMITER_VOTE    10/min  /api/qa/vote
# namespace_id must be a positive integer string that is UNIQUE ACROSS YOUR CLOUDFLARE ACCOUNT (shared with every
# other Worker that uses rate limiting). If 7101-7103 collide with another Worker, pick unused ids before deploying.
# `period` may only be 10 or 60. See docs/OPERATIONS.md "Rate limiting".
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "7101"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER_HEAVY"
namespace_id = "7102"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER_VOTE"
namespace_id = "7103"
simple = { limit = 10, period = 60 }

[vars]
BOING_OBSERVER_ALLOW_DEX_DIAGNOSTICS = "1"
# Public origin of workers/nft-owner-indexer (never a boolean like "1").
NFT_OWNER_INDEXER_URL = "https://boing-nft-owner-indexer.nico-chikuji.workers.dev"
